name: Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f
        with:
          luaVersion: "5.5.0"

      - uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce
        with:
          luarocksVersion: "3.13.0"

      - name: build
        run: |
          luarocks install busted
          luarocks install moonscript
          luarocks install lua-tz

      - name: test
        run: |
          bin/verify-exercises
